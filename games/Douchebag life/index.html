<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Geo games</title>

    <!-- Ruffle Flash Emulator -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #player {
            width: 800px;
            height: 600px;
        }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("player").appendChild(player);
            player.load("games/Douchebag life/Douchebag_Life.swf"); // change this if your file name is different
        });
    </script>
</body>
</html>
